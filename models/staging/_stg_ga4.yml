version: 2

models:
  - name: stg_ga4__events
    description: One row per GA4 event, flattened from the nested export schema.
    columns:
      - name: event_id
        description: Hash of user, timestamp and event name.
        data_tests:
          - not_null
          - unique:
              # The real GA4 export contains a few exact duplicate events.
              config:
                severity: "{{ 'warn' if target.type == 'bigquery' else 'error' }}"
      - name: event_name
        data_tests:
          - not_null
      - name: user_pseudo_id
        description: GA4's anonymous, cookie-level user id.
        data_tests:
          - not_null
      - name: device_category
        data_tests:
          - accepted_values:
              arguments:
                values: ["desktop", "mobile", "tablet"]
              config:
                severity: warn
      - name: purchase_revenue_usd
        description: Only set on purchase events.
